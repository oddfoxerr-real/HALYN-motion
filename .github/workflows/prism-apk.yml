name: Build PRISM APK
on:
  push:
    branches:
      - prism-apk-build
    paths:
      - prism_source_fixed.b64
      - .github/workflows/prism-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-prism-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PRISM build branch
        uses: actions/checkout@v4
      - name: Decode standalone Android source
        run: |
          base64 --decode prism_source_fixed.b64 > PrismWidget-source.zip
          unzip -q PrismWidget-source.zip
          test -f PrismWidget/app/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner's installed Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Assemble PRISM debug APK
        working-directory: PrismWidget
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-v0.5.0-debug-apk
          path: PrismWidget/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
