name: Build Prism v0.15.0 APK
on:
  pull_request:
    paths:
      - 'prism-build/**'
      - '.github/workflows/prism-v015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prism:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Prism build source
        uses: actions/checkout@v4

      - name: Reconstruct and verify Prism v0.15.0 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prism-workspace
          cat prism-build/archive/chunk-*.b64 | base64 --decode > prism-source.tar.xz
          echo "397b9f8e708a28eb5e613eb0e52a590eae428cd3e776f8381035bb2a2be4d713  prism-source.tar.xz" | sha256sum --check
          tar -xJf prism-source.tar.xz -C prism-workspace
          test -f prism-workspace/PrismWidget/app/build.gradle.kts
          grep -F 'versionName = "0.15.0-dev"' prism-workspace/PrismWidget/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile and package Prism 0.15 APK
        working-directory: prism-workspace/PrismWidget
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable Prism debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-v0.15.0-debug-apk
          path: prism-workspace/PrismWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
