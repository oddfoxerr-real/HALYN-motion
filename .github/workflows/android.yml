name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='8'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.6.2-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.6.2-preview.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.6.2 optional touch controls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.6.2-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.6.2-preview.apk
          unzip -t dist/HALYN-Motion-v0.6.2-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.6.2 Preview

          Star Window now has an independent "Tap to travel" toggle,
          disabled by default to prevent accidental hops while using your
          launcher. Enabling it restores tap-a-planet, tap-a-star and
          tap-empty-space movement in both the studio and the live wallpaper.
          The in-app Warp and Explore destination buttons always work.
          Other wallpaper scenes retain their separate Touch interaction
          preference.

          Warp retains its animated star tunnel, central portal,
          arrival pulse, distance HUD and 1-light-year virtual movement.

          Survey / Nebula / Expedition atmospheres add optional GPU cosmic
          clouds and clearly fictional ringed worlds, while retaining
          the 9,096 actual Yale/Hipparcos star positions, real constellation
          outlines and JPL approximate planet positions.

          Location Sky enables an opt-in foreground one-time GPS/network
          fix used with sidereal time and the rotation-vector compass to
          orient the local night sky. The cached fix is private and local;
          there is NO continuous background GPS tracking. An attempted
          warp exits Location Sky and returns to space exploration.

          All thirteen wallpapers, five clock styles and the precision
          HSV colour picker remain available. Device-specific runtime
          visuals, GPS permission flow and launcher touch behavior
          still require on-phone validation.

          - Minimum Android 13.
          - No Unity, PC companion, ads or network permissions.
          - Debug-signed preview: later Play Store production updates require
            a stable release signing key.
          - Unsupported vendor AGSL rendering falls back to a readable gradient.
          - Hardware performance on the Samsung Galaxy A56 is unverified.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.6.2-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.6.2 — Optional Tap to Travel" \
            --notes-file notes.md --prerelease
