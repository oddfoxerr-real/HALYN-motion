name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='11'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.8.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.8.0-preview.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.8.0 Poster Collection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.8.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.8.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.8.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.8.0 Preview

          Adds thirty entirely new subject-led wallpapers to HALYN,
          organized into six curated categories:
          Botanical Posters (flowers), Road & Speed (cars/motorcycles),
          Quiet Worlds (horizons), Illustrated Creatures (original
          animal art), City After Dark (street scenes), and
          Places & Ruins (cabins, temples and lighthouses).

          Each design has distinct built-in composition, palette and
          subtle GPU-free animated elements. Foreground subjects can
          partly occlude HALYN's own configurable clock. All original
          21 wallpapers and advanced gyro modes remain available.

          MY IMAGE: Use Android's system document picker to import
          your own image privately into HALYN. Imported images are
          downsampled and converted to local WebP, with a 24 MB
          input limit. The image is never uploaded or embedded in
          the source repository. The clock remains independently
          editable and the image supports bounded gyro crop.

          Gallery categories are now organized for easier browsing.
          New posters are original illustrations, not licensed
          character portraits and not copies of supplied screenshots.
          Runtime art quality, device-specific performance and
          launcher behavior require on-phone testing.

          - Minimum Android 13.
          - No Unity, PC companion, ads or network calls.
          - Temporary overlay and foreground service only during placement.
          - Debug-signed preview: later Play Store production updates require
            a stable release signing key.
          - Unsupported vendor AGSL rendering falls back to a readable gradient.
          - Hardware performance on the Samsung Galaxy A56 is unverified.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.8.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.8.0 — Poster Collection" \
            --notes-file notes.md --prerelease
