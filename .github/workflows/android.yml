name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='27'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.21.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.21.0-preview.apk > SHA256SUMS.txt)

      - name: Verify curated wallpaper collection
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const val COUNT = 62' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 inkBlack = float3(0.0035, 0.006, 0.014)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 emission = mix(companion, accent' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 col = inkBlack' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'toneMap(col \* 1.22)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          ! grep -q 'float4 dynamics' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          ! grep -q 'u_model' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'touchForce = if' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          test ! -e app/src/main/java/com/oddf0x/halynmotion/ShadesRenderer.kt
          grep -q 'buildOriginalRail(root, "The classics"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Original motion collection"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Fluid ribbons"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Geometry & motion"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          ! grep -q 'shadesPanel' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q '"Ion Veil", "Liquid Chrome", "Nebula Drift"' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'private val AGSL = """' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'value in 52..63 || SmoothWallpaperRenderer.isSmooth(value)' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'buildOriginalRail(root, "Soft glass & flowing silk"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Edge light & energy"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          python3 - <<'PY'
          import re
          from pathlib import Path
          src = Path("app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt").read_text()
          scenes = src.split("val SCENES = listOf(", 1)[1].split("fun isSmooth", 1)[0]
          scene_names = re.findall(r'Scene\("([^"]+)",', scenes)
          shader_list = src.split("private val SCENE_FORMULAS = arrayOf(", 1)[1].split("private val AGSL =", 1)[0]
          formula_count = shader_list.count('""".trimIndent()')
          assert len(scene_names) == 62, f"Expected 62 scenes, got {len(scene_names)}"
          assert len(set(scene_names)) == 62, "Duplicate scene names"
          assert formula_count == 62, f"Expected 62 scene formulas, got {formula_count}"
          assert scene_names[42] == "Satin Tide"
          assert scene_names[51] == "Soft Eclipse"
          assert scene_names[52] == "One Pulse"
          assert scene_names[61] == "Midnight Wave"
          assert "AGSL.replace(SCENE_MARKER, SCENE_FORMULAS[sceneIndex])" in src
          assert "failedSceneIndices.add(sceneIndex)" in src
          print("62 unique scenes map one-to-one to 62 shader programs")
          PY

      - name: Verify clock font storage and preset recovery
        shell: bash
        run: |
          set -euo pipefail
          fonts=app/src/main/java/com/oddf0x/halynmotion/ClockFontStore.kt
          ui=app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          renderer=app/src/main/java/com/oddf0x/halynmotion/ClockOverlayRenderer.kt
          prefs=app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'uniform float u_music;' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'uniform float u_notification;' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'AGSL.replace(SCENE_MARKER, SCENE_FORMULAS\[sceneIndex\])' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'failedSceneIndices.add(sceneIndex)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'val outline = recoveryPath' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'SceneSignalSampler' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/HalynNotificationListener.kt
          test -s "$fonts"
          ! grep -q 'MAX_BYTES' "$fonts"
          ! grep -q 'under 3 MB' "$ui"
          grep -q 'MessageDigest.getInstance("SHA-256")' "$fonts"
          grep -q 'fun list(context: Context): List<ImportedFont>' "$fonts"
          grep -q 'Intent.EXTRA_ALLOW_MULTIPLE' "$ui"
          grep -q 'ClockFontStore.presetTypeface(index)' "$ui"
          grep -q 'fun selectImportedClockFont(id: String)' "$prefs"
          grep -q 'state.clockFontId' "$renderer"
          grep -q 'if (selectedFont != null)' "$renderer"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.21.0 Apple & Samsung Inspirations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.21.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.21.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.21.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.21.0 — Apple & Samsung Inspirations

          - Adds 20 entirely original animated wallpapers: 10 Apple-inspired
            soft-glass, pearlescent, dreamy satin designs and 10 Samsung-inspired
            deep-black AMOLED, aurora, pulse, and dynamic-fold designs.
          - Each uses a separate visual equation with distinct shape and motion,
            not a recolored clone or official device wallpaper.
          - Reactive scenes respond to tilt, local time, music playback activity,
            charging, touch and optional notification timestamps; none capture
            the screen or record audio. Notification access stays opt-in.
          - Personal color palettes remain available, with curated default hues.
          - Preserves all previous 70 original scenes, the clock editor,
            font imports, star window, photos and app settings.
          - Each new scene compiles independently through the v0.20.1 renderer.
          - Debug-signed preview; still needs an on-device visual quality check
            on a Galaxy A56 before calling the shader appearance verified.
          - Unofficial original artworks, not endorsed by Apple or Samsung.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.21.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.21.0 — 20 Apple & Samsung-Inspired Wallpapers" \
            --notes-file notes.md --prerelease
