name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='9'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.7.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.7.0-preview.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.7.0 Mountain Clock Studio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.7.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.7.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.7.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.7.0 Preview

          The original 13 wallpapers remain intact. Four additional
          procedural originals — Orbital Halo, Cosmic Rain, Plasma Loom
          and Eclipse Glass — bring the collection to 17 abstract/space
          scenes. Twilight Peaks, Moonlit Ridge, Alpine Mist and Ember
          Valley complete a 21-scene library of animated wallpapers.

          Mountain foreground silhouettes draw above the clock, allowing
          every clock face to pass behind the terrain naturally. The clock
          supports six built-in font choices plus imported .ttf/.otf files
          (validated, stored locally and limited to 3 MB).

          Clock placement mode opens the actual home screen and provides
          a temporary draggable 5%-snap grid with a top-corner X to save
          and exit. This is an explicit user-initiated Android overlay
          permission, and a temporary foreground notification provides
          an additional exit action. The grid and overlay disappear when
          editing ends; the normalized clock position is saved locally.

          Existing Star Window navigation and the independent opt-in
          Tap to travel toggle are preserved. All 5 clock faces, original
          scenes, custom palettes and astronomy data remain available.

          NOTE: The home-screen drag overlay requires the user's explicit
          Draw over other apps permission. Launcher behaviour, edge-to-edge
          alignment, sensors and thermal performance require device tests.

          - Minimum Android 13.
          - No Unity, PC companion, ads or network calls.
          - Temporary overlay and foreground service only during placement.
          - Debug-signed preview: later Play Store production updates require
            a stable release signing key.
          - Unsupported vendor AGSL rendering falls back to a readable gradient.
          - Hardware performance on the Samsung Galaxy A56 is unverified.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.7.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.7 — Mountain Clock Studio" \
            --notes-file notes.md --prerelease
