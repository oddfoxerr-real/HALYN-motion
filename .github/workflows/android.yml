name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='23'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.18.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.18.0-preview.apk > SHA256SUMS.txt)

      - name: Verify curated wallpaper collection
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const val COUNT = 30' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 inkBlack = float3(0.0035, 0.006, 0.014)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 emission = mix(companion, accent' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 col = inkBlack' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'toneMap(col \* 1.22)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          ! grep -q 'float4 dynamics' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          ! grep -q 'u_model' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'touchForce = if' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          test ! -e app/src/main/java/com/oddf0x/halynmotion/ShadesRenderer.kt
          grep -q 'buildOriginalRail(root, "The classics"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Original motion collection"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Fluid ribbons"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Geometry & motion"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          ! grep -q 'shadesPanel' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q '"Ion Veil", "Liquid Chrome", "Nebula Drift"' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'private val AGSL = """' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'value in 52..63 || SmoothWallpaperRenderer.isSmooth(value)' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.18.0 Original Shader Style
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.18.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.18.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.18.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.18.0 — The Original HALYN Look

          Fixes the previous attempt to introduce new independent motion
          effects in a separate 3D-like material shader that did not look
          like the original HALYN wallpapers.

          - Keeps all 28 original shader effects and exact preset IDs.
          - The 30 additional effects now render with HALYN's original
            deep-dark background, colour palettes, luminous ribbons,
            focused highlights, halo glow and filmic colour treatment.
          - All 30 have new individually designed pattern equations,
            silhouettes and movement, including fluid ribbons, optical
            caustics, cosmic apertures, charged filaments and soft geometry.
          - Removes the separate surface-normal material engine and
            unsupported physical-material controls from the new collection.
          - Preserves the clock studio, gyro/parallax, mountains,
            Star Window, 4K photo gallery and local photo imports.
          - OpenGL/Vulkan options remain removed.
          - Debug-signed preview. Requires on-device AGSL visual testing
            on Galaxy A56 beyond APK compilation verification.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.18.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.18.0 — The Original HALYN Look" \
            --notes-file notes.md --prerelease
