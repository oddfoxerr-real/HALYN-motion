name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='16'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.11.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.11.0-preview.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.11.0 Shader Studio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.11.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.11.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.11.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.11.0 — Shader Studio
          - New filmic AGSL compositor with tonal shoulder, material glints,
            palette-tinted shadows and multi-depth atmospheric lighting.
          - Distinct reflective and atmospheric treatment based on scene.
          - Stable ordered gradient noise reduces colour banding.
          - Cinematic mode adds smooth animated density to Nebula Drift,
            Neon Ink and the global atmospheric field.
          - Shader Detail selector: Efficient, Balanced (default), Cinematic.
          - Gallery thumbnails stay efficient while browsing.
          - Preserves all 28 abstract originals, online licensed 4K
            photos, clocks, sensors, and clock placement.
          Runtime AGSL compatibility and GPU temperature need phone testing.
          The existing shader failure fallback remains enabled.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.11.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.11.0 — Shader Studio" \
            --notes-file notes.md --prerelease
