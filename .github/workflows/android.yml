name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Skia shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libfontconfig1

      - name: Compile and raster-render wallpaper shaders
        run: |
          python -m pip install 'skia-python==144.1'
          python scripts/check_wallpaper_shaders.py --output shader-check

      - name: Upload shader validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Shader-Check
          path: shader-check/
          if-no-files-found: warn
          retention-days: 14

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='33'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.26.1-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.26.1-preview.apk > SHA256SUMS.txt)

      - name: Verify curated wallpaper collection
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const val COUNT = 62' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 inkBlack = float3(0.0035, 0.006, 0.014)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 emission = mix(companion, accent' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 col = inkBlack' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'toneMap(col \* 1.22)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          ! grep -q 'float4 dynamics' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          ! grep -q 'u_model' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'touchForce = if' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          test ! -e app/src/main/java/com/oddf0x/halynmotion/ShadesRenderer.kt
          grep -q 'buildOriginalRail(root, "The classics"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Original motion collection"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Fluid ribbons"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Geometry & motion"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          ! grep -q 'shadesPanel' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q '"Ion Veil", "Liquid Chrome", "Nebula Drift"' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'private val AGSL = """' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'value in 52..63 || SmoothWallpaperRenderer.isSmooth(value)' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'buildOriginalRail(root, "Soft glass & flowing silk"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Edge light & energy"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/QuadColorSystem.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/MaterialXRenderer.kt
          grep -q 'buildOriginalRail(root, "Soft material & horizons"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Architectural motion"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Lenses & refraction"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Crystal depth & motion"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'postInvalidateDelayed(84L)' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'GlassOrbitCollectionRenderer.isGlassOrbit(value)' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'GlassOrbitCollectionRenderer.SCENES.map { it.name }' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/BubbleGardenRenderer.kt
          grep -q 'value == BubbleGardenRenderer.SCENE_INDEX' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'bubbleGardenRenderer.draw(canvas, state, elapsedSeconds)' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'renderer.onBubbleTouch(' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          grep -q 'renderer.onBubbleTouch(' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Touch & pop"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/AuraCyberRenderer.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/AuraCyberShaderRenderer.kt
          grep -q 'auraCyberShaderRenderer.draw(' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'auraCyberShaderRenderer.resetHardwareState()' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'sampleImpact(gyro, state)' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'AuraCyberRenderer.isAuraCyber(value)' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'AuraCyberRenderer.SCENES.map { it.name }' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'auraCyberRenderer.draw(' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'renderer.onAuraCyberTouch(' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          grep -q 'renderer.onAuraCyberTouch(' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Aura & impact"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Data & signal"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'prefs::setStrikeSensitivity' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'prefs::setStrikeDuration' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'materialXRenderer.draw(' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'val t = seconds\*(.78f + state.speed\*.24f)' app/src/main/java/com/oddf0x/halynmotion/MaterialXRenderer.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/GlassOrbitCollectionRenderer.kt
          grep -q 'fun getForPreset(preset: Int)' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'QuadColorSystem.setShaderUniforms' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'QuadColorSystem.setShaderUniforms' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'QuadColorSystem.drawOverlay' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'uniform float3 u_quadFour;' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'uniform float3 u_quadFour;' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          python3 - <<'PY'
          import re
          from pathlib import Path
          src = Path("app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt").read_text()
          scenes = src.split("val SCENES = listOf(", 1)[1].split("fun isSmooth", 1)[0]
          scene_names = re.findall(r'Scene\("([^"]+)",', scenes)
          shader_list = src.split("private val SCENE_FORMULAS = arrayOf(", 1)[1].split("private val AGSL =", 1)[0]
          formula_count = shader_list.count('""".trimIndent()')
          assert len(scene_names) == 62, f"Expected 62 scenes, got {len(scene_names)}"
          assert len(set(scene_names)) == 62, "Duplicate scene names"
          assert formula_count == 62, f"Expected 62 scene formulas, got {formula_count}"
          assert scene_names[42] == "Satin Tide"
          assert scene_names[51] == "Soft Eclipse"
          assert scene_names[52] == "One Pulse"
          assert scene_names[61] == "Midnight Wave"
          material_src = Path("app/src/main/java/com/oddf0x/halynmotion/MaterialXRenderer.kt").read_text()
          material_names = re.findall(r'Scene\("([^"]+)",', material_src)
          assert len(material_names) == 8 and len(set(material_names)) == 8, "Material X scenes must be unique"
          assert "const val FIRST = 137" in material_src
          assert "const val COUNT = 8" in material_src
          assert 'MaterialXRenderer.SCENES.map { it.name }' in Path(
              "app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt").read_text()
          print("8 independent Material X scenes are mapped after the 62 existing smooth shaders")
          assert "AGSL.replace(SCENE_MARKER, SCENE_FORMULAS[sceneIndex])" in src
          assert "failedSceneIndices.add(sceneIndex)" in src
          print("62 unique scenes map one-to-one to 62 shader programs")
          glass_src = Path("app/src/main/java/com/oddf0x/halynmotion/GlassOrbitCollectionRenderer.kt").read_text()
          glass_block = glass_src.split("val SCENES = listOf(", 1)[1].split("fun isGlassOrbit", 1)[0]
          glass_names = re.findall(r'Scene\("([^"]+)",', glass_block)
          glass_formulas = glass_src.split("private val EXPRESSIONS = arrayOf(",1)[1].split(
              "private val SOURCE =",1)[0].count('""".trimIndent()')
          assert len(glass_names) == 10 and len(set(glass_names)) == 10, glass_names
          assert glass_formulas == 10, "Every new Glass Orbit scene needs a distinct shader formula"
          assert "const val FIRST = 145" in glass_src
          assert "const val COUNT = 10" in glass_src
          assert glass_names[0] == "Orbital Lens"
          assert glass_names[-1] == "Luminous Orbit"
          assert "Halo Chamber" not in glass_src
          material_src = Path("app/src/main/java/com/oddf0x/halynmotion/MaterialXRenderer.kt").read_text()
          assert "seconds*(.78f + state.speed*.24f)" in material_src
          assert "h*(.43f+.075f*sin(t*.68f))" in material_src
          assert "val slideX=w*.055f*sin(phase)" in material_src
          ui_src = Path("app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt").read_text()
          assert "postInvalidateDelayed(84L)" in ui_src
          print("10 Glass Orbit scenes + animated Material X verified, legacy IDs unchanged")
          bubble_src = Path("app/src/main/java/com/oddf0x/halynmotion/BubbleGardenRenderer.kt").read_text()
          renderer_src = Path("app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt").read_text()
          service_src = Path("app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt").read_text()
          studio_src = Path("app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt").read_text()
          assert 'const val SCENE_INDEX = 155' in bubble_src
          assert 'const val SCENE_NAME = "Bubble Garden"' in bubble_src
          assert 'bubbleGardenRenderer.onTouch(action, x, y)' in renderer_src
          assert 'BubbleGardenRenderer.SCENE_INDEX' in renderer_src
          assert 'renderer.onBubbleTouch(' in service_src
          assert 'renderer.onBubbleTouch(' in studio_src
          assert 'MotionEvent.ACTION_MOVE' in bubble_src
          assert 'b.burstAt = now' in bubble_src
          assert 'drawBurst(canvas, b, age' in bubble_src
          assert 'val grow = rebuild * rebuild * (3f - 2f * rebuild)' in bubble_src
          assert 'state.fourColorsEnabled' in bubble_src
          assert 'BubbleGardenRenderer.SCENE_NAME' in renderer_src
          print("Bubble Garden preset 155: gesture, burst particles, regen and color integration verified")
          pack_src = Path("app/src/main/java/com/oddf0x/halynmotion/AuraCyberRenderer.kt").read_text()
          pack_block = pack_src.split("val SCENES = listOf(",1)[1].split("fun isAuraCyber",1)[0]
          pack_names = re.findall(r'Scene\("([^"]+)",',pack_block)
          assert len(pack_names) == 12 and len(set(pack_names)) == 12, pack_names
          assert pack_names[0] == "Aura Strike" and pack_names[5] == "Pulse Slash"
          assert pack_names[6] == "Cipher Veil" and pack_names[11] == "Signal Intrusion"
          assert 'const val FIRST = 156' in pack_src
          assert 'const val COUNT = 12' in pack_src
          methods = ["auraStrike", "novaClash", "impactVeil", "voidRush", "energyBreak",
              "pulseSlash", "cipherVeil", "ghostTrace", "vectorBreach",
              "packetDrift", "zeroGrid", "signalIntrusion"]
          for method in methods:
              assert f"private fun {method}(" in pack_src, f"Missing independent {method} renderer"
          assert 'speed >= threshold && travelledDp > 22f' in pack_src
          assert '1200f/sensitivity.coerceIn(.5f,2f)' in pack_src
          assert 'val speed=if (dt in .012f..0.20f)' in pack_src
          assert 'state.fourColorsEnabled' in pack_src
          assert 'val age=(now-burstTime).toFloat()/' in pack_src
          assert 'drawBattleBurst(' in pack_src and 'drawCyberBurst(' in pack_src
          assert 'HALYN-Motion-v0.26.1-preview.apk' in Path(".github/workflows/android.yml").read_text()
          assert 'versionCode = 32' in Path("app/build.gradle.kts").read_text()
          assert 'value == BubbleGardenRenderer.SCENE_INDEX' in renderer_src
          print("12 unique animated Aura/Cyber scenes 156..167: gesture speed, motion, 4-color, all legacy IDs verified")
          gpu_src = Path("app/src/main/java/com/oddf0x/halynmotion/AuraCyberShaderRenderer.kt").read_text()
          gpu_expr = gpu_src.split("private val EXPRESSIONS = arrayOf(",1)[1].split(
              "private val SOURCE =",1)[0]
          assert gpu_expr.count('""".trimIndent()') == 12, "12 distinct GPU materials expected"
          assert "SOURCE.replace(PLACEHOLDER, EXPRESSIONS[index])" in gpu_src
          assert "RuntimeShader(" in gpu_src
          assert "u_quadFour" in gpu_src and "QuadColorSystem.setShaderUniforms(shader,state)" in gpu_src
          assert "if (Build.VERSION.SDK_INT<33 || !canvas.isHardwareAccelerated" in gpu_src
          assert "failed.add(index)" in gpu_src
          assert "paint.shader=null" in gpu_src
          assert "sampleImpact(gyro, state)" in renderer_src
          assert 'auraCyberShaderRenderer.resetHardwareState()' in renderer_src
          assert 'if (!auraCyberShaderRenderer.draw(' in renderer_src
          assert "AuraCyberRenderer.SCENES.map { it.name }" in renderer_src
          assert "versionCode = 32" in Path("app/build.gradle.kts").read_text()
          print("12 short independent AGSL optical programs, fallback and lifecycle tested structurally")
          PY

      - name: Verify clock font storage and preset recovery
        shell: bash
        run: |
          set -euo pipefail
          fonts=app/src/main/java/com/oddf0x/halynmotion/ClockFontStore.kt
          ui=app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          renderer=app/src/main/java/com/oddf0x/halynmotion/ClockOverlayRenderer.kt
          prefs=app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'uniform float u_music;' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'uniform float u_notification;' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'AGSL.replace(SCENE_MARKER, SCENE_FORMULAS\[sceneIndex\])' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'failedSceneIndices.add(sceneIndex)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'val outline = recoveryPath' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'SceneSignalSampler' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/HalynNotificationListener.kt
          test -s "$fonts"
          ! grep -q 'MAX_BYTES' "$fonts"
          ! grep -q 'under 3 MB' "$ui"
          grep -q 'MessageDigest.getInstance("SHA-256")' "$fonts"
          grep -q 'fun list(context: Context): List<ImportedFont>' "$fonts"
          grep -q 'Intent.EXTRA_ALLOW_MULTIPLE' "$ui"
          grep -q 'ClockFontStore.presetTypeface(index)' "$ui"
          grep -q 'fun selectImportedClockFont(id: String)' "$prefs"
          grep -q 'state.clockFontId' "$renderer"
          grep -q 'if (selectedFont != null)' "$renderer"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.26.1 Shader Repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.26.1-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.26.1-preview.apk
          unzip -t dist/HALYN-Motion-v0.26.1-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.26.1 — Shader Scope Repair

          - Fixes shader compilation for Velvet Horizon, Midnight Wave,
            Aura Strike, Pulse Slash and Signal Intrusion. Scene-local
            variables no longer collide with shared lighting/gesture code.
          - Preserves all 121 wallpapers, artwork equations, IDs, clock/font
            features, gesture controls and per-scene four-colour choices.
          - Adds desktop Skia compile/raster checks for all 74 Smooth and
            Aura/Cyber shaders, with rendered-frame evidence in CI artifacts.
          - Debug-signed preview using the existing build convention.
            Desktop checks do not replace Galaxy A56 GPU/device testing.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.26.1-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.26.1 — Shader Scope Repair" \
            --notes-file notes.md --prerelease
