name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='25'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.20.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.20.0-preview.apk > SHA256SUMS.txt)

      - name: Verify curated wallpaper collection
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const val COUNT = 42' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 inkBlack = float3(0.0035, 0.006, 0.014)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 emission = mix(companion, accent' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'float3 col = inkBlack' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'toneMap(col \* 1.22)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          ! grep -q 'float4 dynamics' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          ! grep -q 'u_model' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'touchForce = if' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          test ! -e app/src/main/java/com/oddf0x/halynmotion/ShadesRenderer.kt
          grep -q 'buildOriginalRail(root, "The classics"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Original motion collection"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Fluid ribbons"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q 'buildOriginalRail(root, "Geometry & motion"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          ! grep -q 'shadesPanel' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          grep -q '"Ion Veil", "Liquid Chrome", "Nebula Drift"' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'private val AGSL = """' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'value in 52..63 || SmoothWallpaperRenderer.isSmooth(value)' app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt

      - name: Verify clock font storage and preset recovery
        shell: bash
        run: |
          set -euo pipefail
          fonts=app/src/main/java/com/oddf0x/halynmotion/ClockFontStore.kt
          ui=app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          renderer=app/src/main/java/com/oddf0x/halynmotion/ClockOverlayRenderer.kt
          prefs=app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'uniform float u_music;' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'uniform float u_notification;' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'SceneSignalSampler' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/HalynNotificationListener.kt
          test -s "$fonts"
          ! grep -q 'MAX_BYTES' "$fonts"
          ! grep -q 'under 3 MB' "$ui"
          grep -q 'MessageDigest.getInstance("SHA-256")' "$fonts"
          grep -q 'fun list(context: Context): List<ImportedFont>' "$fonts"
          grep -q 'Intent.EXTRA_ALLOW_MULTIPLE' "$ui"
          grep -q 'ClockFontStore.presetTypeface(index)' "$ui"
          grep -q 'fun selectImportedClockFont(id: String)' "$prefs"
          grep -q 'state.clockFontId' "$renderer"
          grep -q 'if (selectedFont != null)' "$renderer"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.20.0 Unlimited Clock Fonts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.20.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.20.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.20.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.20.0 — Unlimited Font Library

          - Removes the 3 MB imported clock font cap.
          - No artificial total-library count or size quotas; installed fonts
            use ordinary app-private storage limited by available device space.
          - Import multiple TTF/OTF/TTC font files together using Android's
            document picker without overwriting earlier imports.
          - Fonts are content-addressed and validated before being saved;
            identical files are stored only once.
          - Previously imported single-font files migrate into the library.
          - Preset clock fonts use distinct real typeface families, with
            actual font previews in their selectable chips.
          - Font selection immediately reveals the digital clock in preview
            if the clock was previously disabled.
          - Analogue clock displays hour numerals with non-default fonts,
            making preset and custom font selection visible there too.
          - Imported font picker supports previewing, selecting and deleting
            individual local fonts, with persistence across app restarts.
          - Clocks auto-fit their lettering to different font widths.
          - All 28 original shaders and 30 additions are retained.
          - Debug-signed preview. Native Android font rendering still needs
            on-device verification on Samsung Galaxy A56.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.20.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.20.0 — Unlimited Fonts & Preset Repairs" \
            --notes-file notes.md --prerelease
