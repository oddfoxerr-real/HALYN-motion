name: HALYN Motion Android APK

on:
  push:
    branches: [main, halyn-v06-verified-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.6.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.6.0-preview.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/halyn-v06-verified-build'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.6 expedition wallpaper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.6.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.6.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.6.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.6.0 Preview

          Warp now has a visible animated star tunnel, central portal,
          arrival pulse and distance HUD; the dedicated in-app warp button
          signals the actual live wallpaper engine as well as the studio.
          Physics still moves the virtual camera one real light-year.

          Survey / Nebula / Expedition atmospheres add optional GPU cosmic
          clouds and clearly fictional ringed worlds, while retaining
          the 9,096 actual Yale/Hipparcos star positions, real constellation
          outlines and JPL approximate planet positions.

          Location Sky enables an opt-in foreground one-time GPS/network
          fix used with sidereal time and the rotation-vector compass to
          orient the local night sky. The cached fix is private and local;
          there is NO continuous background GPS tracking. An attempted
          warp exits Location Sky and returns to space exploration.

          All thirteen wallpapers, five clock styles and the precision
          HSV colour picker remain available. Device-specific runtime
          visuals, GPS permission flow and launcher touch behavior
          still require on-phone validation.

          - Minimum Android 13.
          - No Unity, PC companion, ads or network permissions.
          - Debug-signed preview: later Play Store production updates require
            a stable release signing key.
          - Hardware performance on the Samsung Galaxy A56 is unverified.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.6.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.6 — Expedition, Warp and Location Sky" \
            --notes-file notes.md --prerelease
