name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='36'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.30.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.30.0-preview.apk > SHA256SUMS.txt)

      - name: Verify fluid wallpapers, gesture capture, and preserved space
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("app/src/main/java/com/oddf0x/halynmotion")
          ui = (root / "MainActivity.kt").read_text()
          prefs = (root / "HalynRenderer.kt").read_text()
          flow = (root / "FluidMotionRenderer.kt").read_text()
          store = (root / "FluidGestures.kt").read_text()
          studio = (root / "FluidGestureStudio.kt").read_text()
          wallpaper = (root / "HalynWallpaperService.kt").read_text()
          assert "const val FIRST = 176" in flow and "const val COUNT = 6" in flow
          assert len(re.findall(r'^\s*Scene\("', flow, re.M)) == 6
          assert "RuntimeShader(AGSL)" in flow and "renderFallback" in flow
          assert "u_action" in flow and "trigger(action: Int" in flow
          assert 'buildOriginalRail(root, "Liquid, satin & ink"' in ui
          assert 'buildOriginalRail(root, "Star Window", listOf(StarWindowRenderer.SCENE_INDEX))' in ui
          assert len(re.findall(r'buildOriginalRail\(root,', ui)) == 3
          assert "FluidGestureStudio" in ui and "fluidStroke.handle" in ui
          assert "FluidMotionRenderer.isFluid(value)" in prefs
          assert "StarWindowRenderer.SCENE_INDEX" in prefs
          assert 'triggerFluidGesture' in prefs and 'FluidMotionRenderer.isFluid(settings.preset)' in wallpaper
          assert 'fun match(raw: List<PointF>)' in store
          assert 'fun save(name: String, action: Int' in store
          assert 'GesturePad' in studio and 'Save gesture' in studio
          assert "ClockFontStore.presetTypeface" in ui
          assert 'versionCode = 36' in Path("app/build.gradle.kts").read_text()
          print("HALYN v0.30: six fluid scenes, architecture, masked photography and preserved Space")
          PY

      - name: Verify clock font storage and preset recovery
        shell: bash
        run: |
          set -euo pipefail
          fonts=app/src/main/java/com/oddf0x/halynmotion/ClockFontStore.kt
          ui=app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt
          renderer=app/src/main/java/com/oddf0x/halynmotion/ClockOverlayRenderer.kt
          prefs=app/src/main/java/com/oddf0x/halynmotion/HalynRenderer.kt
          grep -q 'uniform float u_music;' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'uniform float u_notification;' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'AGSL.replace(SCENE_MARKER, SCENE_FORMULAS\[sceneIndex\])' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'failedSceneIndices.add(sceneIndex)' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'val outline = recoveryPath' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          grep -q 'SceneSignalSampler' app/src/main/java/com/oddf0x/halynmotion/HalynWallpaperService.kt
          test -s app/src/main/java/com/oddf0x/halynmotion/HalynNotificationListener.kt
          test -s "$fonts"
          ! grep -q 'MAX_BYTES' "$fonts"
          ! grep -q 'under 3 MB' "$ui"
          grep -q 'MessageDigest.getInstance("SHA-256")' "$fonts"
          grep -q 'fun list(context: Context): List<ImportedFont>' "$fonts"
          grep -q 'Intent.EXTRA_ALLOW_MULTIPLE' "$ui"
          grep -q 'ClockFontStore.presetTypeface(index)' "$ui"
          grep -q 'fun selectImportedClockFont(id: String)' "$prefs"
          grep -q 'state.clockFontId' "$renderer"
          grep -q 'if (selectedFont != null)' "$renderer"

      - name: Verify Minimal Depth architecture and photography
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main/java/com/oddf0x/halynmotion")
          prefs = (root / "HalynRenderer.kt").read_text()
          gallery = (root / "MainActivity.kt").read_text()
          photo = (root / "PhotoWallpaperStore.kt").read_text()
          composer = (root / "DepthLayerStore.kt").read_text()
          editor = (root / "DepthMaskEditor.kt").read_text()
          clock = (root / "ClockOverlayRenderer.kt").read_text()
          architecture = (root / "MinimalArchitectureRenderer.kt").read_text()
          assert "value == PhotoWallpaperStore.SCENE_INDEX" in prefs
          assert "value == MinimalArchitectureRenderer.SCENE_INDEX" in prefs
          assert "depthLayerStore.draw(canvas, state, gyro, photoRenderer)" in prefs
          assert "drawSubjectLayer" in photo
          assert "createCutout(points:" in composer and "PorterDuff.Mode.SRC_IN" in composer
          assert "private class OutlineCanvas" in editor
          assert "CommonsGalleryView(this)" in gallery and "online_source" in gallery
          assert "Use Minimal Depth clock" in gallery and "Minimal Depth" in gallery
          assert "6 -> monumental(" in clock
          assert "const val SCENE_INDEX = 182" in architecture
          assert "RuntimeShader(AGSL)" in architecture and "drawFallback" in architecture
          assert "float3 rotateY(" in architecture
          print("Depth studio wiring, local masking and analytic architecture present")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.30.0 Minimal Depth
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.30.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.30.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.30.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN v0.30.0 — Minimal Depth Studio

          Includes a new Cinematic Depth studio for high-resolution imported
          photographs and properly attributed Wikimedia Commons artwork.
          Users can trace a subject in-app, or import a transparent foreground
          image, and render HALYN's monochrome oversized clock between layers.
          Manual masking creates an antialiased offline alpha PNG.

          New Monolith Light original has an analytic-lit graphite surface,
          subtle gyro motion and Canvas fallback. The six previously released
          Fluid Motion scenes and the original Space scene remain intact.

          No account or automatic background web downloads are required.
          No ML auto-subject segmentation is claimed. Test subject outline
          quality, parallax stability, GPU appearance and launcher gestures
          on the Samsung Galaxy A56: successful CI is not visual validation.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.30.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.30.0 — Minimal Depth Studio" \
            --notes-file notes.md --prerelease
