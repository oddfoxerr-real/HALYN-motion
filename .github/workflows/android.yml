name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='13'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.9.1-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.9.1-preview.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.9.1 Online 4K Gallery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.9.1-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.9.1-preview.apk
          unzip -t dist/HALYN-Motion-v0.9.1-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.9.1 Preview

          HALYN now browses REAL ONLINE 4K+ wallpapers from Wikimedia
          Commons instead of offering new procedurally generated artwork.

          - Fresh installs open the online photo slot by default, without
            showing an unwanted built-in procedural animation.
          - Existing selections are preserved until replaced.
          - Browse Nature, Cars, Flowers, Space, City, Art, Mountains or
            search for a custom topic; load additional Commons results.
          - Real images only: 3840x2160-equivalent originals with declared
            CC0, public domain, CC BY or CC BY-SA licenses.
          - Original source page, license and photographer/artist are
            visible before download and remain linked afterwards.
          - Only downloads the image selected by the user over HTTPS.
          - Offline image retains up to 4096 pixels after local WebP
            conversion, using capped input transfer and decode size.
          - Existing HALYN 5-style clock editor, home-screen grid,
            custom font and gyro remain functional for photo mode.
          - Local image import works without the internet.

          Copyright-restricted galleries and AI-generated assets are
          not bundled. Wikimedia API connection, photo downloads and
          device-specific performance require an actual phone test.

          - Minimum Android 13.
          - No Unity, PC companion or ads; network used for opt-in online gallery.
          - Temporary overlay and foreground service only during placement.
          - Debug-signed preview: later Play Store production updates require
            a stable release signing key.
          - Unsupported vendor AGSL rendering falls back to a readable gradient.
          - Hardware performance on the Samsung Galaxy A56 is unverified.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.9.1-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.9.1 — Online 4K Gallery" \
            --notes-file notes.md --prerelease
