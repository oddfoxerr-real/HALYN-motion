name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='15'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.10.1-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.10.1-preview.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.10.1 Rendering Engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.10.1-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.10.1-preview.apk
          unzip -t dist/HALYN-Motion-v0.10.1-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.10.1 — Rendering Engine

          - Paces frames around the selected 30, 45 or 60 FPS instead of
            waking every vsync unnecessarily.
          - Dynamically reduces the render target when frame costs are
            persistently high, and returns to the selected rate after recovery.
          - Motion-disabled photo wallpapers sleep between clock ticks,
            and stop scheduling entirely when no clock is shown.
          - Removed the redundant full-screen clear before procedural AGSL.
          - Caches unchanged shader uniforms; only time and input pose are
            applied to each frame.
          - Restores GPU shader state on new wallpaper surfaces and draws a
            colour-matched gradient if a shader is unavailable.
          - Studio preview also idles on a motion-disabled photo.
          - Colour and clock edits no longer restart gyro tracking.
          - Preserves the 28 originals, real 4K gallery, and all clock controls.

          Actual GPU frame pacing and device thermals must be verified on
          Samsung hardware. Debug-signed Android 13+ preview.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.10.1-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.10.1 — Rendering Engine" \
            --notes-file notes.md --prerelease
