name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='37'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.31.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.31.0-preview.apk > SHA256SUMS.txt)

      - name: Verify sourced-only gallery, licensing and photo compositor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base = Path("app/src/main/java/com/oddf0x/halynmotion")
          ui = (base/"MainActivity.kt").read_text()
          prefs = (base/"HalynRenderer.kt").read_text()
          commons = (base/"Commons4kCatalog.kt").read_text()
          gallery = (base/"CommonsGalleryView.kt").read_text()
          depth = (base/"DepthLayerStore.kt").read_text()
          photo = (base/"PhotoWallpaperStore.kt").read_text()
          clock = (base/"ClockOverlayRenderer.kt").read_text()
          on_create = ui.split("override fun onCreate(savedInstanceState:",1)[1].split("private fun buildHeader(",1)[0]
          assert "buildDepthStudio(column)" in on_create
          for retired in ("buildScenes(column)", "buildFluidGestures(column)", "buildStarWindow(column)", "buildMotion(column)", "buildColours(column)"):
              assert retired not in on_create, "Old wallpaper section visible: " + retired
          assert "private fun sanitizePreset(value: Int): Int = PhotoWallpaperStore.SCENE_INDEX" in prefs
          assert "value == StarWindowRenderer.SCENE_INDEX -> value" not in prefs
          assert "value == MinimalArchitectureRenderer.SCENE_INDEX -> value" not in prefs
          assert "fun featured(): Page" in commons
          assert len(commons.split('val FEATURED_TITLES = listOf(',1)[1].split(')',1)[0].split('.jpg"')) >= 6
          assert "acceptedLicense(license)" in commons
          assert "trustedUpload(original)" in commons
          assert "metadata(meta, \"Artist\")" in commons
          assert "Source & license" in gallery
          assert "fun loadFeatured()" in gallery
          assert "createCutout(points:" in depth
          assert "drawSubjectLayer" in photo
          assert "6 -> monumental(" in clock
          assert 'versionCode = 37' in Path("app/build.gradle.kts").read_text()
          print("HALYN 0.31: no built-in presets selectable; Commons sources with attribution and depth clock")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.31.0 Sourced Artwork
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.31.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.31.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.31.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN v0.31.0 — Real Photography Collection

          The generated and procedural wallpaper presets are retired from
          active selection, including Space and Fluid. Existing downloaded
          or personally imported artwork remains in device storage.

          Only sourced 4K–6K photography is offered. A six-photo editorial
          selection uses exact Wikimedia Commons file titles, resolves each
          artist, original media URL, dimensions and license live, and provides
          source/license links. Additional Commons search is optional.

          A reduced studio presents image preview, source gallery, optional
          clock behind subject, manual foreground masking and gentle parallax.
          No images are falsely labelled animated. Photographs are static;
          only the optional clock and parallax have movement.

          Requires network access to browse; downloaded artwork works offline.
          On-device Samsung A56 visual and battery testing is still required.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.31.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.31.0 — Sourced Artwork" \
            --notes-file notes.md --prerelease
