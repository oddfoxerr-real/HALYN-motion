name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='20'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.15.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.15.0-preview.apk > SHA256SUMS.txt)

      - name: Verify curated wallpaper collection
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const val COUNT = 30' app/src/main/java/com/oddf0x/halynmotion/SmoothWallpaperRenderer.kt
          test ! -e app/src/main/java/com/oddf0x/halynmotion/ShadesRenderer.kt
          ! grep -q 'buildOriginalRail(root, "The classics"' app/src/main/java/com/oddf0x/halynmotion/MainActivity.kt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.15.0 Smooth Wallpapers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.15.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.15.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.15.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN v0.15.0 — 30 Smooth Originals

          - Added thirty individually authored native-resolution procedural
            wallpaper shaders. Every scene has a different material/shape
            field, motion equation and physically coherent colour scheme.
          - Replaced the flat-colour original shader packs, older coloured
            SHADES renderer, and retired illustrated posters.
          - Five galleries with six styles each: minerals, nature, fabrics,
            astronomy and architectural scenes.
          - Continuous smooth texture interpolation, height-field lighting,
            restrained emission and filmic colour mapping.
          - Kept four mountain wallpapers, Star Window, the licensed 4K
            image gallery, imported photos, gyro and clock customisation.
          - Old preset selections migrate to Frosted Glass Ridges.
          - Debug-signed. Test visual output and temperatures on actual
            Galaxy A56 hardware; CI cannot execute AGSL shaders.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.15.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.15.0 — 30 Smooth Originals" \
            --notes-file notes.md --prerelease
