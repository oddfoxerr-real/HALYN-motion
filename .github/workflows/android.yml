name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='12'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.9.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.9.0-preview.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.9.0 Online 4K Gallery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.9.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.9.0-preview.apk
          unzip -t dist/HALYN-Motion-v0.9.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN Motion v0.9.0 Preview

          New gallery direction requested by HALYN's owner:
          stop generating wallpaper designs and use REAL ONLINE 4K IMAGES.

          - Live Wikimedia Commons search with Nature, Cars, Flowers,
            Space, City, Art and Mountains browsing plus custom queries.
          - Filters image results to minimum original 3840 x 2160
            equivalent (long side >= 3840 and short side >= 2160).
          - Only selects files reporting a reusable free-content
            license (CC0, public domain, CC BY or CC BY-SA).
          - Shows original author, file page, license and resolution
            before downloading. Source link remains visible afterwards.
          - Downloads original pixels from Wikimedia on request only,
            stores up to 4096 pixels as a private offline WebP with
            bounded-memory decoding; no earlier 2K reduction.
          - Original generated wallpaper gallery is no longer visible
            to select. Existing active procedural scenes are retained
            only to avoid breaking previous selections until replaced.
          - Keeps HALYN clock fonts/positioning and gyro parallax.
          - Local image import remains available offline.

          No user screenshots, chat content, scraped fan art,
          unlicensed images or external wallpapers are bundled.
          Internet permission enables explicit image search/download.
          A photo is not fetched when an offline wallpaper renders.

          - The real Commons network, filter effectiveness and
            source compliance must also be checked on a device.

          - Minimum Android 13.
          - No Unity, PC companion or ads; network used for opt-in online gallery.
          - Temporary overlay and foreground service only during placement.
          - Debug-signed preview: later Play Store production updates require
            a stable release signing key.
          - Unsupported vendor AGSL rendering falls back to a readable gradient.
          - Hardware performance on the Samsung Galaxy A56 is unverified.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.9.0-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.9.0 — Online 4K Gallery" \
            --notes-file notes.md --prerelease
