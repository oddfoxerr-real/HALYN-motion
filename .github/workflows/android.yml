name: HALYN Motion Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halyn-motion-android-preview
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compile HALYN Motion
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package and wallpaper service
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "versionCode='41'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q "android.service.wallpaper.WallpaperService"
          mkdir -p dist
          cp "$apk" dist/HALYN-Motion-v0.35.0-preview.apk
          (cd dist && sha256sum HALYN-Motion-v0.35.0-preview.apk > SHA256SUMS.txt)

      - name: Verify sourced-only gallery, licensing and photo compositor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base = Path("app/src/main/java/com/oddf0x/halynmotion")
          ui = (base/"MainActivity.kt").read_text()
          prefs = (base/"HalynRenderer.kt").read_text()
          commons = (base/"Commons4kCatalog.kt").read_text()
          gallery = (base/"CommonsGalleryView.kt").read_text()
          depth = (base/"DepthLayerStore.kt").read_text()
          photo = (base/"PhotoWallpaperStore.kt").read_text()
          clock = (base/"ClockOverlayRenderer.kt").read_text()
          on_create = ui.split("override fun onCreate(savedInstanceState:",1)[1].split("private fun buildHeader(",1)[0]
          assert "buildDepthStudio(column)" in on_create
          for retired in ("buildScenes(column)", "buildFluidGestures(column)", "buildStarWindow(column)", "buildMotion(column)", "buildColours(column)"):
              assert retired not in on_create, "Old wallpaper section visible: " + retired
          assert "private fun sanitizePreset(value: Int): Int = PhotoWallpaperStore.SCENE_INDEX" in prefs
          assert "value == StarWindowRenderer.SCENE_INDEX -> value" not in prefs
          assert "value == MinimalArchitectureRenderer.SCENE_INDEX -> value" not in prefs
          assert "fun featured(): Page" in commons
          assert 'val FEATURED_TITLES = listOf(' in commons
          assert 'Spiral architecture and light (Unsplash).jpg' in commons
          assert 'Glass building wall in soho (Unsplash).jpg' in commons
          assert 'Silhouettes In Black and White.jpg' in commons
          assert 'Faber-Hochhaus (Magdeburg-Altstadt).09.ajb.jpg' in commons
          assert "acceptedLicense(license)" in commons
          assert "trustedUpload(original)" in commons
          assert "metadata(meta, \"Artist\")" in commons
          assert "Source & license" in gallery
          assert "fun loadFeatured()" in gallery
          assert "createCutout(points:" in depth
          assert "drawSubjectLayer" in photo
          assert "6 -> monumental(" in clock
          assert 'versionCode = 41' in Path("app/build.gradle.kts").read_text()
          print("HALYN 0.33: stable imported-photo framing, sourced gallery and auto masking")
          PY

      - name: Verify photo swap generation safety and automatic subject masking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base = Path("app/src/main/java/com/oddf0x/halynmotion")
          photo = (base / "PhotoWallpaperStore.kt").read_text()
          depth = (base / "DepthLayerStore.kt").read_text()
          auto = (base / "AutoSubjectCutout.kt").read_text()
          ui = (base / "MainActivity.kt").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          gradle = Path("app/build.gradle.kts").read_text()
          assert "File.createTempFile" in photo
          assert "StandardCopyOption.ATOMIC_MOVE" in photo
          assert "photo_generation" in photo
          assert "cachedGeneration == generation" in photo
          assert "depth_source_generation" in depth
          assert "currentPhotoGeneration() != expectedGeneration" in depth
          assert "installSegmentedForeground(" in depth
          assert "SubjectSegmentation.getClient" in auto
          assert "ModuleInstall.getClient" in auto
          assert "enableForegroundBitmap()" in auto
          assert "Auto detect subject" in ui
          assert "auto_mask_on_import" in ui
          assert "maybeAutoMaskAfterImport()" in ui
          assert "subject_segment" in manifest
          assert "play-services-mlkit-subject-segmentation:16.0.0-beta1" in gradle
          print("HALYN 0.33: atomic photo replacement, stale mask isolation, and ML model wiring verified")
          PY

      - name: Verify physical-screen framing, clock and subject alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          b = Path("app/src/main/java/com/oddf0x/halynmotion")
          layout = (b / "PhotoFraming.kt").read_text()
          photo = (b / "PhotoWallpaperStore.kt").read_text()
          settings = (b / "HalynRenderer.kt").read_text()
          service = (b / "HalynWallpaperService.kt").read_text()
          clock = (b / "ClockOverlayRenderer.kt").read_text()
          depth = (b / "DepthLayerStore.kt").read_text()
          ui = (b / "MainActivity.kt").read_text()
          assert "const val FIT = 0" in layout
          assert "const val FILL = 1" in layout
          assert "const val AUTO = 2" in layout
          assert "val extra = (sw - vw)" in layout
          assert "PhotoFraming.calculate(" in photo
          assert "photoFitMode = preferences.getInt" in settings
          assert "setPhotoFitMode(value: Int)" in settings
          assert "PhotoFraming.viewport(" in service
          assert "display.getRealSize(point)" in service
          assert "photoViewport = photoViewport" in service
          assert "photoViewport: RectF?" in clock
          assert "activeViewportWidth" in clock
          assert "state.photoFitMode" in depth
          assert '"Full image", "Fill screen", "Auto"' in ui
          # Regression: the original portrait should fit a 709x1536 display,
          # even when the wallpaper canvas is twice the visible width.
          original_w, original_h = 940, 1672
          visible_w, visible_h = 709, 1536
          surface_w = 2 * visible_w
          viewport_w = min(visible_w, surface_w)
          scale = min(viewport_w / original_w, visible_h / original_h)
          fitted_w, fitted_h = original_w * scale, original_h * scale
          assert abs(fitted_w - visible_w) < 1.0
          assert fitted_h <= visible_h
          assert scale < 0.8  # Old canvas-based cover scale was ~1.55.
          print("Photo fits physical display, not launcher scroll surface; clock and mask share viewport")
          PY

      - name: Verify widget composition and blurred edge extension
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/oddf0x/halynmotion")
          store=(root/"WallpaperWidgetStore.kt").read_text()
          painter=(root/"WallpaperWidgetRenderer.kt").read_text()
          editor=(root/"WidgetGridEditor.kt").read_text()
          main=(root/"MainActivity.kt").read_text()
          service=(root/"HalynWallpaperService.kt").read_text()
          photo=(root/"PhotoWallpaperStore.kt").read_text()
          blur=(root/"SoftEdgeBitmap.kt").read_text()
          clock=(root/"ClockOverlayRenderer.kt").read_text()
          assert "widget_composition_v1" in store and "widget_composer_enabled" in store
          for kind in ('"clock"','"date"','"battery"','"text"','"weekday"','"divider"'):
              assert kind in store
          assert "clock.draw(" in painter and "battery.getIntProperty" in painter
          assert "canvas.rotate(w.rotation" in painter
          assert "canvas.scale(w.scale" in painter
          assert "ACTION_POINTER_DOWN" in editor
          assert "pointerDistance(e)" in editor and "pointerAngle(e)" in editor
          assert "Snap to 5% grid" in main
          assert "ColorPickerDialog" in main
          assert "buildWidgetStudio(column)" in main
          assert "widgetRenderer.draw(canvas, settings, photoViewport)" in service
          assert "drawForeground(" in service
          assert "overrideTint: Int?" in clock
          assert "SoftEdgeBitmap.create(photo)" in photo
          assert "PhotoFraming.FILL" in photo
          assert "repeat(3)" in blur
          assert 'versionCode = 41' in Path("app/build.gradle.kts").read_text()
          print("Widget studio, live renderer, source-depth order and cached blurred margins verified")
          PY

      - name: Verify real Home-screen widget overlay and safety controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/oddf0x/halynmotion")
          service=(root/"HomeWidgetEditorService.kt").read_text()
          main=(root/"MainActivity.kt").read_text()
          grid=(root/"WidgetGridEditor.kt").read_text()
          store=(root/"WallpaperWidgetStore.kt").read_text()
          wallpaper=(root/"HalynWallpaperService.kt").read_text()
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert 'requestHomeWidgetEditor()' in main
          assert 'launchHomeWidgetEditor()' in main
          assert 'Intent(this, HomeWidgetEditorService::class.java)' in main
          assert 'CATEGORY_HOME' in main
          assert 'ACTION_MANAGE_OVERLAY_PERMISSION' in main
          assert 'android:name=".HomeWidgetEditorService"' in manifest
          assert 'android:exported="false"' in manifest
          assert 'android.permission.SYSTEM_ALERT_WINDOW' in manifest
          assert 'TYPE_APPLICATION_OVERLAY' in service
          assert 'FOREGROUND_SERVICE_TYPE_SPECIAL_USE' in service
          assert 'ACTION_EXIT' in service
          assert 'PendingIntent.getService' in service
          assert 'Settings.canDrawOverlays' in service
          assert 'WidgetGridEditor(' in service
          assert 'widgets.activate(preferences.get())' in service
          assert 'widgets.add(kind)' in service
          assert 'widgets.delete(current.id)' in service
          assert 'widget.copy(scale = value)' in service
          assert 'widget.copy(rotation = value)' in service
          assert 'widget.copy(color = shade)' not in service or 'color = shade' in service
          assert 'inputDialog?.dismiss()' in service
          assert 'dialog.window?.setType(WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY)' in service
          assert 'handler.postDelayed(flushPending, 95L)' in service
          assert 'onPreview' in grid and 'ACTION_POINTER_DOWN' in grid
          assert 'widget_composer_enabled' in store
          assert 'widgetRenderer.draw(canvas, settings, photoViewport)' in wallpaper
          assert 'versionCode = 41' in Path("app/build.gradle.kts").read_text()
          print("On-Home-screen editor: permission, service lifecycle, 6 widgets, live edits and Exit checks verified")
          PY

      - name: Compile isolated HALYN Repair Test APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PrepairPreview=true

      - name: Verify and collect side-by-side repair preview
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.oddf0x.halynmotion.repairpreview'"
          cp "$apk" dist/HALYN-v0.35-home-widget-test.apk
          (cd dist && sha256sum HALYN-v0.35-home-widget-test.apk >> SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HALYN-Motion-Android
          path: dist
      - name: Publish HALYN v0.35.0 Home Widget Editor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.35.0-preview.1
        run: |
          set -euo pipefail
          test -s dist/HALYN-Motion-v0.35.0-preview.apk
          test -s dist/HALYN-v0.35-home-widget-test.apk
          unzip -t dist/HALYN-v0.35-home-widget-test.apk >/dev/null
          unzip -t dist/HALYN-Motion-v0.35.0-preview.apk >/dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This exact release already exists. Keeping its original version."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          # HALYN v0.35 — Edit Widgets on Your Actual Home Screen

          HALYN now opens a temporary transparent home-screen editor on top of
          the live Samsung launcher, using the same optional Draw over apps
          permission and foreground notification escape hatch as the existing
          clock-placement overlay. The old clock-placement feature is preserved.

          Launch from Widget Studio > Edit widgets on Home screen. HALYN returns
          to the launcher and places a grid with resize and rotation handles
          over its actual wallpaper-drawn elements. Add clocks, dates, weekdays,
          battery indicators, custom text and dividers from the bottom tray.
          Select, drag, pinch/rotate, adjust exact size and rotation, set colour
          presets or enter a custom hex shade. Text has a direct editor too.
          The background wallpaper redraws during drags via batched preference
          commits; Done or the notification Exit removes the overlay entirely.

          Samsung's own system launcher widgets, Spotify and other Android
          AppWidgets are outside HALYN's wallpaper compositor and cannot be
          moved by this tool. This overlays edits for HALYN-rendered widgets,
          keeping existing imported artwork, clock fonts and depth masks.

          The v0.35 Home Widget Test APK can be installed alongside previous
          HALYN versions. GitHub verifies compilation, package integrity and
          overlay wiring; actual One UI gestures and IME need A56 device QA.
          NOTES
          gh release create "$TAG" dist/HALYN-Motion-v0.35.0-preview.apk \
            dist/HALYN-v0.35-home-widget-test.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HALYN Motion v0.35.0 — Home Widget Editor" \
            --notes-file notes.md --prerelease
