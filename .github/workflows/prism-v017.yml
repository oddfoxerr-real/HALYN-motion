name: Build Prism v0.17.0 APK
on:
  pull_request:
    paths:
      - 'prism-build/**'
      - '.github/workflows/prism-v017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prism:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Prism build source
        uses: actions/checkout@v4

      - name: Reconstruct and verify Prism v0.17.0 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prism-workspace
          cat prism-build/v017-source.tar.xz.b64 | base64 --decode > prism-source.tar.xz
          echo "8856eb51291c97e48c172a890e061617ba9e09b8f734299aaac4d9817bb92c4e  prism-source.tar.xz" | sha256sum --check
          tar -xJf prism-source.tar.xz -C prism-workspace
          patch -p0 -d prism-workspace < prism-build/v017-workspace-fix.patch
          test -f prism-workspace/PrismWidget/app/build.gradle.kts
          grep -F 'versionName = "0.17.0-dev"' prism-workspace/PrismWidget/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 with direct SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMGR" ]; then
            echo "No sdkmanager found; installing Google Android command-line tools"
            curl --fail --location --retry 3 --output /tmp/android-commandline-tools.zip 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
            mkdir -p /tmp/android-commandline-tools
            unzip -q /tmp/android-commandline-tools.zip -d /tmp/android-commandline-tools
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -r /tmp/android-commandline-tools/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using Android SDK manager: $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile and package Prism 0.17 APK
        working-directory: prism-workspace/PrismWidget
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable Prism debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-v0.17.0-workspace-debug-apk
          path: prism-workspace/PrismWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
