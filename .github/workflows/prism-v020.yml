name: Build Prism v0.20 KWGT Items APK
on:
  pull_request:
    paths:
      - 'prism-build/**'
      - '.github/workflows/prism-v020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prism-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Prism sources
        uses: actions/checkout@v4

      - name: Verify and unpack v0.20 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prism-workspace
          cat prism-build/v020-items-source.tar.xz.b64 | base64 --decode > prism-source.tar.xz
          echo "e8775f153d4ac8976c952aa1a73169d514f6224b858bc62ec6545dea4f3f3a2a  prism-source.tar.xz" | sha256sum --check
          tar -xJf prism-source.tar.xz -C prism-workspace
          test -f prism-workspace/PrismWidget/app/build.gradle.kts
          grep -F 'versionName = "0.20.0-kwgt-items"' prism-workspace/PrismWidget/app/build.gradle.kts
          python3 prism-workspace/PrismWidget/tools/check_items.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMGR" ]; then
            curl --fail --location --retry 3 --output /tmp/android-cmdline-tools.zip 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
            mkdir -p /tmp/android-cmdline
            unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -r /tmp/android-cmdline/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile Prism v0.20 APK
        working-directory: prism-workspace/PrismWidget
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and stage versioned APK
        id: package
        run: |
          python3 - <<'PY'
          import hashlib, os, re, shutil, subprocess, zipfile
          from pathlib import Path
          apk = Path('prism-workspace/PrismWidget/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None, 'APK archive is corrupt'
          aapt = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/aapt'
          metadata = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          package = re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", metadata, re.M)
          assert package, 'Missing APK package metadata'
          name, code, version = package.groups()
          assert name == 'com.oddfox.prism', f'Unexpected package: {name}'
          assert re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z._+-]*', version), 'Unsafe artifact version'
          source = Path('prism-workspace/PrismWidget/app/build.gradle.kts').read_text()
          assert re.search(r'versionCode\s*=\s*(\d+)', source).group(1) == code
          assert re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1) == version
          output = Path('prism-dist')
          output.mkdir(exist_ok=True)
          target = output / f'PRISM-v{version}-debug.apk'
          shutil.copyfile(apk, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (output / 'SHA256SUMS.txt').write_text(f'{digest}  {target.name}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'version={version}\n')
          print(f'Verified {name} {version} ({code}); staged {target.name}')
          PY
      - name: Publish verified Prism debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-v${{ steps.package.outputs.version }}-debug-apk
          path: prism-dist/
          if-no-files-found: error
          retention-days: 30
