name: Build STRATA APK
on:
  push:
    branches: [strata-apk]
    paths: ['strata/**', '.github/workflows/strata.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/strata
          tar -xJf strata/source.tar.xz -C /tmp/strata
          cp strata/WonderlandLayout.java strata/ProjectGallery.java /tmp/strata/app/src/main/java/studio/strata/wallpaper/
          mkdir -p /tmp/strata/app/src/androidTest/java/studio/strata/wallpaper
          cp strata/StrataQa.java /tmp/strata/app/src/androidTest/java/studio/strata/wallpaper/
          cd /tmp/strata
          python3 "$GITHUB_WORKSPACE/strata/patch_layout.py"
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - run: |
          mkdir -p dist
          cp /tmp/strata/app/build/outputs/apk/debug/app-debug.apk dist/Strata-0.3.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Strata-0.3.0-debug.apk
          (cd dist && sha256sum Strata-0.3.0-debug.apk > SHA256SUMS.txt)
          cp /tmp/strata/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/qa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Strata-0.3.0-APK
          path: dist/
          if-no-files-found: error
      - name: Publish STRATA preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="strata-v0.3.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/Strata-0.3.0-debug.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "STRATA 0.3.0 preview" --notes "Side-by-side debug preview of the standalone layered STRATA wallpaper editor. Device testing pending." --prerelease

  functional-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Strata-0.3.0-APK
          path: dist
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android editor and wallpaper picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash strata/verify_editor.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STRATA-functional-test-results
          path: qa-results/
          if-no-files-found: warn
      - name: Publish verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="strata-v0.3.0-preview.${GITHUB_RUN_NUMBER}"
          if [ -f qa-results/instrumentation.log ]; then
            gh release upload "$tag" qa-results/instrumentation.log --repo "$GITHUB_REPOSITORY" --clobber
            if grep -q STRATA_QA_PASS qa-results/instrumentation.log && grep -q STRATA_WALLPAPER_APPLIED qa-results/instrumentation.log; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "Signed standalone STRATA APK. Native Android editor checks passed, including image replacement, and Android reported STRATA as active wallpaper. Physical Galaxy A56 testing remains pending."
            elif grep -q STRATA_QA_PASS qa-results/instrumentation.log && grep -q STRATA_PICKER_OPENED qa-results/instrumentation.log; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "Signed standalone STRATA APK. Native editor checks passed and system wallpaper picker opened. Final wallpaper selection and physical Galaxy A56 testing remain unconfirmed."
            fi
          fi
