name: Build STRATA APK
on:
  push:
    branches: [strata-apk]
    paths: ['strata/source.tar.xz', '.github/workflows/strata.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/strata
          tar -xJf strata/source.tar.xz -C /tmp/strata
          cd /tmp/strata
          gradle :app:assembleDebug --no-daemon --stacktrace
      - run: |
          mkdir -p dist
          cp /tmp/strata/app/build/outputs/apk/debug/app-debug.apk dist/Strata-0.2.1-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Strata-0.2.1-debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Strata-0.2.1-APK
          path: dist/
          if-no-files-found: error
